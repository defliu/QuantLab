# Project_23 每日模拟盘 —— 策略配置
# 定位：前向纸面组合模拟（组合级账本 + NAV 曲线 + 跨日状态持久化）
# 与回测的区别：每日推进一天、状态可恢复，用于验证策略实盘可行性
#
# 口径权威来源（改这里之前先确认源策略没有变）：
#   G2   : projects/Project_16_LightGBM股票大师/g2_config.py
#   V13  : projects/Project_16_LightGBM股票大师/qmt_config.py + rebalance_daily.py

global:
  start_capital: 100000.0      # 每个策略独立资金池 10 万（用户 2026-10-21 拍板）
  slippage: 0.001              # 单边滑点 0.1%（与 scan_rotate_cost_real 一致）
  deploy_pct: 0.98             # 满仓部署比例（对齐 G2 RESERVE_CASH_PCT=0.02）
  # 费用：实盘费率，直接读 qmt_config（COMM_RATE/COMM_MIN/STAMP_RATE/TRANS_RATE）
  fee_source: qmt_config
  # ---- 每日自动推进（step 模式）----
  max_gap_days: 30             # 回看窗口：停机后最多可补齐这么多自然日内的交易日
  stale_days: 5                # 行情最新交易日距今超过此天数 → 判定数据源停更并告警

strategies:
  g2:
    enabled: true
    display_name: "G2 大QMT文件桥（外部信号版）"
    account_id: "70180771"
    # 信号源：候选池文件（top10 是候选池，不是选股结果；按 top_n 截断取前 N）
    # 注意：目录内同时存在 _g2_top2.csv / _g2_top3.csv / _g2_top10.csv，
    #       统一读 top10 再截断，避免同一天多文件重复建仓
    signal_dir: "projects/Project_16_LightGBM股票大师/data/selections/g2"
    # 后缀优先顺序：优先候选池最大的 top10，缺失则回退 top3/top2。
    # 历史原因：2026-08-17~09-01 产物只有 top2；09-02 起才有 top10。
    # 持仓只数由下方 top_n 控制，与文件名无关，避免同日多文件重复建仓。
    signal_pattern: "{date}_g2_top10.csv"
    signal_patterns:
      - "{date}_g2_top10.csv"
      - "{date}_g2_top3.csv"
      - "{date}_g2_top2.csv"
    score_col: total_new
    redline: 60.0                # g2_config.REDLINE
    top_n: 3                     # g2_config.TOP_N（2026-09-21 拍板 2→3）
    hold_days: 15                # g2_config.HOLD_DAYS
    exit_mode: live_trail        # 桥出场 = STOP→TP→TRAIL
    stop_loss: -0.07             # qmt_config.STOP_LOSS_PCT
    take_profit: 0.15            # qmt_config.TAKE_PROFIT_PCT
    trailing_pct: 0.08           # qmt_config.TRAILING_PCT
    trailing_activate_pct: 0.08  # qmt_config.TRAILING_ACTIVATE_PCT
    posfilter: ""                # g2_config.POSFILTER_MODE 默认关闭
    # 仓位管理口径（2026-10-21 新增，复刻 rebalance_g2.py L586-625）：
    #   equal_weight = 动态等权——target_value = 资金池×deploy_pct/TOP_N，
    #                  持仓市值超过目标即减仓释放资金（实盘 G2 的真实做法）
    #   留空         = 按剩余现金均分（简化口径，与实盘不符）
    rebalance_mode: equal_weight

  v13:
    enabled: true
    display_name: "V1.3 miniQMT（外部信号版·旧链 selection_full）"
    account_id: "67014907"
    # 信号源：_selection_full.csv（旧链 09:45 重排产物）
    # 2026-10-21 改：原用 final_list，但该产物 2026-09-30 才开始生成，
    # 而实盘 08-20~09-30 执行的是 selection_full 链路 → 两者代码重合度 0，对照无效。
    # selection_full 覆盖 08-19 起完整区间，且与实盘同链路。
    # 结构：5 行候选，无 redline_pass 列，按 total >= REDLINE(58) 过滤后按 total 降序取 Top5。
    signal_dir: "projects/Project_16_LightGBM股票大师/data/selections"
    signal_pattern: "{date}_selection_full.csv"
    signal_patterns:
      - "{date}_selection_full.csv"
    score_col: total
    redline: 58.0                # rebalance_daily.REDLINE
    top_n: 5                     # rebalance_daily.TOP_N（2026-09-21 拍板 2→5）
    hold_days: 5                 # rebalance_daily.HOLD_DAYS
    exit_mode: live_trail
    stop_loss: -0.07
    take_profit: 0.15
    trailing_pct: 0.08
    trailing_activate_pct: 0.08
    # 位置过滤第一步暂不启用（position_filter 依赖额外特征，骨架跑通后再接）
    # 启用后需同步标注：回放结果与实盘口径存在 PF 差异
    posfilter: ""
