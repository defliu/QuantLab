# ATR 低波动 —— 10万/8只+价<50 + 大盘 MA200 门控（hold：只挡买入/重进，不强制清仓）
# 温和版：跌破 MA200 时保留现有持仓、不再新买/重进（针对"全止损后季内重进接飞刀"场景）
backtest:
  name: atr_10w_price50_ma200_hold
  start_date: "2019-01-01"
  end_date: "2026-06-30"
  initial_cash: 100000.0
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq

universe:
  csv: "D:/QuantLab/data/universe_all_a.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0005

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly
  n_hold: 8
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  min_history: 252
  position_sizing: equal
  max_positions: 8
  min_position_value: 0.0
  max_price: 50.0
  market_gate: 1          # 大盘门控开
  ma_window: 200          # 全市场等权收盘 vs MA200
  gate_mode: hold         # hold=保留持仓、只挡新买/重进
