# ATR 低波动策略 —— 10万真钱版 + 真实价<50元过滤 回测配置
# 目的：验证 10 万真钱 + 8 只持仓 + 季频 + 大盘门控 + 价格过滤 的真实曲线
# 动机：小资金(10万)买高价股只能买零星几手、现金闲置严重；且期末持仓曾出现
#       全部停牌无法调仓的情况。过滤"真实收盘价<50元"（用真实价=复权价/adj_factor，
#       非复权价），保证每只约1.25万预算至少可买2手以上。
# 对比：原版 10万/8只（total_return 182.94% / 年化25.40% / 回撤-24.45%）
#       原版 100万/100只（total_return 167.66% / 年化23.28% / 回撤-19.33%）

backtest:
  name: atr_10w_price50_max020_liquid
  start_date: "2019-01-01"
  end_date: "2026-06-30"
  initial_cash: 100000.0        # 10 万真钱
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq

universe:
  csv: "D:/QuantLab/data/universe_liquid_30e.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0005

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly      # 季频（降手续费）
  n_hold: 8                      # 8 只（10万/8 = 每只1.25万）
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  min_history: 252
  position_sizing: equal
  max_positions: 8
  min_position_value: 0.0
  max_price: 50.0               # 新增：真实收盘价 < 50 元（0=关闭）
  max_exclude_pct: 0.20             # MAX 0.20 + 流动性子样本(circ_mv≥30亿)
