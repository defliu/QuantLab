# ATR 低波动策略 —— 10万真钱版回测配置
# 目的：验证 10 万真钱 + 8 只持仓 + 季频 + 大盘门控 的真实曲线
# 对比：原版 100 万 + 100 只（框架验证 18.69%）

backtest:
  name: atr_lowvol_10w_8
  start_date: "2019-01-01"
  end_date: "2026-06-30"
  initial_cash: 100000.0        # 10 万真钱
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq

universe:
  csv: "D:/QuantLab/data/universe_all_a.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0005

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly      # 季频（降手续费）
  n_hold: 8                      # 8 只（10万/8 = 每只1.25万，够整手）
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  min_history: 252
  position_sizing: equal
  max_positions: 8
  min_position_value: 0.0
