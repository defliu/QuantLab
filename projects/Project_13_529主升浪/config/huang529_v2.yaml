# 黄氏529主升浪精选 —— v2 基线（用户拍板：持有20天 + 止损-12%）
# 529 信号日买入池内 ATR 低波 top8，持有至止损-12%/20天到期
backtest:
  name: huang529_v2
  start_date: "2019-01-01"
  end_date: "2026-06-30"
  initial_cash: 1000000.0
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq

universe:
  csv: "D:/QuantLab/data/universe_all_a.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0005

strategy: huang_529
trading_model: next_open

strategy_params:
  n_hold: 8
  max_holding_days: 20
  stop_loss: -0.12
  market_gate: 0
  ma_window: 200
  gate_mode: exit
  signal_window: 1
  max_single_pct: 0.125