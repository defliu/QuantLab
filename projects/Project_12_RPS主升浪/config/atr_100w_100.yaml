# ATR 低波动策略 —— 原版对比配置（100万 + 100只）
# 目的：作为 10万版 的对照组（框架验证年化 18.69% 的基线）

backtest:
  name: atr_lowvol_100w_100
  start_date: "2019-01-01"
  end_date: "2026-06-30"
  initial_cash: 1000000.0       # 100 万
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq

universe:
  csv: "D:/QuantLab/data/universe_all_a.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0005

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly
  n_hold: 100                    # 100 只（原版）
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  min_history: 252
  position_sizing: equal
  max_positions: 100
  min_position_value: 0.0
