# ATR 低波动策略 —— 框架通用组合层全开（演示"任何策略即插即跑 + 真实约束 + 15%+ 路径"）
backtest:
  name: atr_lowvol_fw_leveraged
  start_date: "2023-01-03"
  end_date: "2026-07-31"
  initial_cash: 1000000.0
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq
  fundamentals: false

universe:
  csv: "D:/QuantLab/config/full_a_sh_sz.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0001

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly
  n_hold: 50                      # 杠杆下减只数，绕开整数手瓶颈
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  # --- 框架通用组合层全开 ---
  position_sizing: vol_parity     # 按 1/波动率 配权
  target_leverage: 1.5            # 两融杠杆（自动计提利息）
  vol_target: 0.18                # 波动率目标 18%（2026-08-09 调参扫描定格：年化23.7%/夏普1.015/回撤-18%，综合最优）
  industry_cap: 0.15              # 单行业 ≤15%
  max_positions: 0
  min_position_value: 0.0
  vol_window: 60
  margin_interest_rate: 0.06
