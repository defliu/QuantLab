# ATR 低波动 + 风险 overlay（波动率目标 + 波动平价）
# 验证方向3：不动合格域，只加组合层风险控制，看能否削减 -17% 回撤、抬升夏普。
backtest:
  name: atr_lowvol_vt_fw
  start_date: "2023-01-03"
  end_date: "2026-07-31"
  initial_cash: 1000000.0
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq
  fundamentals: false

universe:
  csv: "D:/QuantLab/config/full_a_sh_sz.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0001

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly
  n_hold: 100
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  # --- 风险 overlay（不动合格域，只控风险）---
  position_sizing: vol_parity     # 波动平价加权（低波动股给更高权）
  vol_target: 0.10                # 目标波动率 10%，高波动期自动降仓
  target_leverage: 1.0
  industry_cap: 0.0
  max_positions: 0
  min_position_value: 0.0
  vol_window: 60
  margin_interest_rate: 0.06
