# ============================================================
# 资金分配总表 —— 单一事实源（机器可校验）
# ------------------------------------------------------------
# 硬规则：所有策略 capital_base 之和 必须 <= account.total_capital
# 任何策略新增 / 调整本金，改这里 + 跑：
#   python scripts/check_capital_allocation.py
# 校验器会同时核对每个策略独立 config 里的 capital_base 是否与此表一致。
# ============================================================

account:
  id: "67014907"
  broker: "国金QMT模拟端"
  # 账户实际总资产（元）。
  # 在国金QMT客户端「查询 -> 资金股份」查“总资产”填入。
  # 未填(null)时校验脚本只警告、不报硬错；但生产环境必须填真实值！
  total_capital: 10000000  # 1000万（国金QMT模拟端，2026-08-05 由大诚填报）
  note: "共享账户资金上限；各策略虚拟子账户之和不得超此值（硬约束）"

strategies:
  - key: atr_lowvol_equalweight
    name: "ATR低波等权不杠杆(8只集中)"
    capital_base: 100000
    max_hold: 8
    config_file: "config/atr_lowvol_equalweight_config.yaml"
    note: "满仓等权8只集中版；10万/8=1.25万/只 + 真实价<50过滤(2026-08-14 由100只改8只，诚哥拍板)；NAV含浮盈滚动；虚拟子账户，绝不抢占他人资金/持仓"

  - key: value_smallcap_v2
    name: "价值小盘V2(退市排雷+buffer)"
    capital_base: 100000
    max_hold: 80
    config_file: "config/value_smallcap_v2_config.yaml"
    note: "纯行业中性BP+质量排雷+退市排雷+buffer160；双月调仓80只；虚拟子账户，绝不抢占他人资金/持仓"

  - key: huang529_breakout
    name: "黄氏529主升浪(ATR低波top16)"
    capital_base: 100000
    max_hold: 12
    config_file: "D:/QMT_POOL/p13_huang529_config.yaml"
    note: "529信号日更CSV管道+09:35开盘执行；T-1信号补槽12只、1/12等权、止损-12%/到期60交易日/trail15默认关；虚拟子账户，绝不抢占他人资金/持仓（T-20260817-001 任务书T5登记）"

