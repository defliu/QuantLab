# ============================================================
# 资金分配总表 —— 单一事实源（机器可校验）
# ------------------------------------------------------------
# 硬规则：所有策略 capital_base 之和 必须 <= account.total_capital
# 任何策略新增 / 调整本金，改这里 + 跑：
#   python scripts/check_capital_allocation.py
# 校验器会同时核对每个策略独立 config 里的 capital_base 是否与此表一致。
# ============================================================

account:
  id: "70180771"  # 国金QMT模拟端账号（跑 ATR/黄氏529/G2/融合/全天候等纯 QMT 策略；旧号 67014907 承载 Project_16 V1.3 与 Project_10 价值小盘V2，双账号并存）
  broker: "国金QMT模拟端"
  # 账户实际总资产（元）。
  # 在国金QMT客户端「查询 -> 资金股份」查“总资产”填入。
  # 未填(null)时校验脚本只警告、不报硬错；但生产环境必须填真实值！
  total_capital: 10000000  # 1000万（国金QMT模拟端，2026-08-05 由大诚填报；换号后待复核实际总资产）
  note: "共享账户资金上限；各策略虚拟子账户之和不得超此值（硬约束）。注：value_smallcap_v2 账本实际落在账号 67014907，此处仍登记其 capital_base 便于统一口径。"

