# ATR 低波动策略 —— 纯杠杆验证（证明杠杆代码路径真实生效）
# 对比：atr_lowvol_fw.yaml（不杠杆） vs 本配置（1.5x 两融 + 等权 + 无 vol_target）
backtest:
  name: atr_lowvol_fw_leverage_only
  start_date: "2023-01-03"
  end_date: "2026-07-31"
  initial_cash: 1000000.0
  benchmark_code: "000300.SH"
  benchmark_db_path: "F:/backtest_workspace/data/duckdb/benchmark_index.duckdb"

data:
  source: astock
  path: "E:/astock/daily/stock_daily.parquet"
  adjustment: hfq
  fundamentals: false

universe:
  csv: "E:/QuantLab/config/full_a_sh_sz.csv"

execution:
  price: next_open
  slippage: 0.001
  commission_rate: 0.00025
  tax_rate: 0.0001

strategy: atr_lowvol
trading_model: next_open

strategy_params:
  rebalance_freq: quarterly
  n_hold: 100
  atr_win: 14
  atr_pct_max: 0.06
  turnover_min: 1.0
  turnover_max: 8.0
  quality_gate: 1
  momentum_gate: 1
  stop_loss: -0.08
  # --- 组合层：纯杠杆，关闭所有保守叠加层以验证杠杆路径 ---
  position_sizing: equal
  target_leverage: 1.5            # >1 启用两融（自动计提利息）
  vol_target: 0.0                 # 关闭波动率目标，让杠杆直接生效
  industry_cap: 0.0
  max_positions: 0
  min_position_value: 0.0
  vol_window: 60
  margin_interest_rate: 0.06
